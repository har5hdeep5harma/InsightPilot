[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpilot-backend"
version = "0.1.0"
description = "FastAPI backend for InsightPilot deterministic spreadsheet analysis."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "SQLAlchemy>=2.0.0",
  "python-multipart>=0.0.9",
  "Jinja2>=3.1.0"
]

[project.optional-dependencies]
pdf = [
  "weasyprint>=62.0"
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py311"
